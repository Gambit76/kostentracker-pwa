<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#1e293b"/>
      <stop offset="100%" stop-color="#0f172a"/>
    </linearGradient>
    <linearGradient id="accent" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#10b981"/>
      <stop offset="100%" stop-color="#059669"/>
    </linearGradient>
    <filter id="shadow" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="8" stdDeviation="12" flood-color="#000000" flood-opacity="0.4"/>
    </filter>
  </defs>
  
  <!-- App Background -->
  <rect width="512" height="512" rx="112" fill="url(#bg)"/>
  
  <!-- Subtle Border -->
  <rect x="2" y="2" width="508" height="508" rx="110" fill="none" stroke="#334155" stroke-width="4"/>

  <!-- Icon Graphics: Wallet / Card / Coin -->
  <g filter="url(#shadow)" transform="translate(64, 76)">
    <!-- Base Wallet Shape -->
    <rect x="24" y="80" width="336" height="230" rx="36" fill="#1e293b" stroke="#475569" stroke-width="6"/>
    
    <!-- Top Flap Card -->
    <path d="M 60 80 L 60 56 C 60 40 73 28 90 28 L 294 28 C 311 28 324 40 324 56 L 324 80" fill="none" stroke="#64748b" stroke-width="8" stroke-linecap="round"/>
    
    <!-- Accent Wallet Pocket -->
    <path d="M 24 160 C 100 160 140 180 192 180 C 244 180 284 160 360 160 L 360 274 C 360 294 344 310 324 310 L 60 310 C 40 310 24 294 24 274 Z" fill="#0f172a" stroke="#334155" stroke-width="6"/>

    <!-- Glowing Coin with Euro Symbol -->
    <g transform="translate(192, 175)">
      <circle cx="0" cy="0" r="64" fill="url(#accent)"/>
      <circle cx="0" cy="0" r="56" fill="none" stroke="#34d399" stroke-width="3" opacity="0.6"/>
      <!-- Euro Symbol -->
      <text x="0" y="21" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="64" font-weight="900" fill="#ffffff" text-anchor="middle">€</text>
    </g>

    <!-- Speed Lightning / Fast Entry Accent Dot -->
    <circle cx="310" cy="120" r="10" fill="#10b981"/>
  </g>
</svg>
